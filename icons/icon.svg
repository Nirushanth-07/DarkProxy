<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyber Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outermost Cyber Hexagon Shield -->
  <polygon points="64,8 116,28 116,84 64,120 12,84 12,28" fill="#0d0f12" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Inner Dark Panel -->
  <polygon points="64,18 106,34 106,78 64,108 22,78 22,34" fill="#16191f" stroke="#2e3846" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Cyber Dragon Wing / Abstract Lines -->
  <path d="M40,40 L64,48 L88,40 L94,62 L64,74 L34,62 Z" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" opacity="0.8" />
  
  <!-- Terminal Prompt Symbol in Center -->
  <path d="M48,50 L56,56 L48,62" fill="none" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="60" y1="62" x2="72" y2="62" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Proxy Node Links -->
  <circle cx="64" cy="90" r="5" fill="#ff3860" />
  <path d="M44,78 Q64,84 64,90" fill="none" stroke="#8c92ac" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M84,78 Q64,84 64,90" fill="none" stroke="#8c92ac" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
