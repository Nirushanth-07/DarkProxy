<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkProxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window">

    <header class="titlebar">
      <div class="titlebar-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="titlebar-title">darkproxy — ~/route</span>
      <span class="titlebar-meta">v1.0</span>
    </header>

    <main class="screen">
      <canvas id="matrix-canvas" aria-hidden="true"></canvas>

      <div id="view-dashboard" class="view active">

        <section class="block">
          <div class="block-head">
            <span class="cmd"><span class="ps1">$</span> darkproxy status</span>
            <label class="toggle" title="Route traffic through the selected profile">
              <input type="checkbox" id="proxy-toggle" aria-label="Proxy enabled">
              <span class="toggle-ui" aria-hidden="true"><span class="toggle-off">off</span><span class="toggle-on">on</span></span>
            </label>
          </div>

          <div class="route">
            <span class="route-node">browser</span>
            <span class="route-link"></span>
            <span class="route-node route-proxy" id="route-proxy">direct</span>
            <span class="route-link"></span>
            <span class="route-node">internet</span>
          </div>

          <dl class="kv">
            <div><dt>profile</dt><dd id="active-profile-name">none</dd></div>
            <div><dt>proto</dt><dd id="active-profile-type">—</dd></div>
            <div><dt>gateway</dt><dd id="active-profile-address">—</dd></div>
            <div><dt>uptime</dt><dd id="uptime-counter">00:00:00</dd></div>
          </dl>
        </section>

        <section class="block">
          <div class="block-head">
            <span class="cmd"><span class="ps1">$</span> netstat --route</span>
            <span class="note" id="packet-status">idle</span>
          </div>
          <div class="stats">
            <div class="stat"><span class="stat-label">packets</span><span class="stat-bar" id="packet-bar"></span><span class="stat-value" id="packet-count-val">0</span></div>
            <div class="stat"><span class="stat-label">latency</span><span class="stat-bar" id="latency-bar"></span><span class="stat-value" id="latency-val">0 ms</span></div>
            <div class="stat"><span class="stat-label">throughput</span><span class="stat-bar" id="bitrate-bar"></span><span class="stat-value" id="bitrate-val">0.0 kB/s</span></div>
            <div class="stat"><span class="stat-label">cpu</span><span class="stat-bar" id="cpu-bar"></span><span class="stat-value" id="cpu-val">0%</span></div>
          </div>
        </section>

        <section class="block">
          <div class="block-head">
            <span class="cmd"><span class="ps1">$</span> ls profiles <span class="note" id="profile-count">(0)</span></span>
            <button type="button" id="go-to-add-btn" class="btn-text">+ add</button>
          </div>
          <ul id="profiles-list" class="profiles"></ul>
        </section>

        <section class="block block-log">
          <div class="block-head">
            <span class="cmd"><span class="ps1">$</span> tail -f darkproxy.log</span>
            <button type="button" id="clear-log-btn" class="btn-text">clear</button>
          </div>
          <div class="log" id="log-body">
            <div id="terminal-content"></div>
            <div class="prompt-line" aria-hidden="true"><span class="ps1">$</span><span class="cursor"></span></div>
          </div>
        </section>
      </div>

      <div id="view-add-profile" class="view">
        <section class="block">
          <div class="block-head">
            <span class="cmd"><span class="ps1">$</span> darkproxy add</span>
            <button type="button" id="back-to-dash-btn" class="btn-text">cancel</button>
          </div>

          <form id="add-proxy-form" class="form">
            <div class="field">
              <label for="proxy-name">--name</label>
              <input type="text" id="proxy-name" placeholder="tor-local" required autocomplete="off">
            </div>
            <div class="field">
              <label for="proxy-type">--type</label>
              <select id="proxy-type" required>
                <option value="socks">socks5</option>
                <option value="socks4">socks4</option>
                <option value="http">http</option>
                <option value="https">https</option>
              </select>
            </div>
            <div class="field">
              <label for="proxy-host">--host</label>
              <input type="text" id="proxy-host" placeholder="127.0.0.1" value="127.0.0.1" required autocomplete="off">
            </div>
            <div class="field">
              <label for="proxy-port">--port</label>
              <input type="number" id="proxy-port" placeholder="1080" value="1080" required min="1" max="65535" autocomplete="off">
            </div>
            <div class="field">
              <label for="proxy-user">--user</label>
              <input type="text" id="proxy-user" placeholder="optional" autocomplete="off">
            </div>
            <div class="field">
              <label for="proxy-pass">--pass</label>
              <input type="password" id="proxy-pass" placeholder="optional" autocomplete="off">
            </div>
            <div class="form-actions">
              <button type="submit" id="add-btn" class="btn">save profile</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="statusbar">
      <span class="sb-session">[darkproxy]</span>
      <span class="sb-state"><span class="led"></span><span id="status-text">direct</span></span>
      <span class="sb-spacer"></span>
      <button type="button" id="sound-toggle-btn" class="sb-btn" aria-pressed="false">snd:off</button>
      <button type="button" id="matrix-toggle-btn" class="sb-btn" aria-pressed="false">rain:off</button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
